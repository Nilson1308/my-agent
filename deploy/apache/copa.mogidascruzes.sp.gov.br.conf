# my-agent em produção — COPA
# Domínio público: https://copa.mogidascruzes.sp.gov.br
# TLS termina no proxy reverso municipal; origem HTTP (:80).
#
# Instalação:
#   sudo cp /var/www/my-projects/my-agent/deploy/apache/copa.mogidascruzes.sp.gov.br.conf \
#           /etc/apache2/sites-available/copa.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName copa.mogidascruzes.sp.gov.br

    ErrorLog ${APACHE_LOG_DIR}/copa-error.log
    CustomLog ${APACHE_LOG_DIR}/copa-access.log combined

    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"

    ProxyTimeout 300
    LimitRequestBody 20971520

    # PWA estática (Vue) — build: ./deploy/build-pwa.sh → pwa/dist
    Alias /app /var/www/my-projects/my-agent/pwa/dist
    <Directory /var/www/my-projects/my-agent/pwa/dist>
        Options -Indexes +FollowSymLinks
        Require all granted
        FallbackResource /app/index.html
    </Directory>

  # Não enviar /app ao Gunicorn
    ProxyPass /app !
    ProxyPass / http://127.0.0.1:8045/
    ProxyPassReverse / http://127.0.0.1:8045/
</VirtualHost>